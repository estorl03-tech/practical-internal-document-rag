services:
  db:
    image: pgvector/pgvector:pg17
    container_name: business-rag-db
    environment:
      POSTGRES_DB: business_rag
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
